name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Swift version follows the runner image's Xcode. Both are checked because the
    # toolchains disagree: 5.10 rejected a weak-self capture that 6.x accepts, and
    # 6.x tightens concurrency checks that 5.10 only warns about.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Build with strict concurrency
        run: swift build -c release -Xswiftc -strict-concurrency=complete

      # XCTest is not available on every machine, so the suite is a plain executable.
      - name: Test
        run: swift run BackgroundWatchTests

      - name: Package app bundle
        run: ./package-app.sh
